name: athar
description: "جدول حلقتي - إدارة مواعيد دروس الطلاب وحلقة القرآن والغياب"
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.3

  # Routing
  go_router: ^14.2.0

  # Fonts & Styling
  google_fonts: ^6.2.1

  # Local Storage & SQLite Offline Cache
  shared_preferences: ^2.2.3
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # Utilities & Helpers
  intl: ^0.20.2
  url_launcher: ^6.2.6
  uuid: ^4.3.3
  pdf: ^3.10.8
  excel: ^4.0.2
  share_plus: ^9.0.0
  flutter_animate: ^4.5.2
  animations: ^2.0.11
  file_picker: ^8.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code Generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.3.9
  drift_dev: ^2.16.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/tahoma.ttf
